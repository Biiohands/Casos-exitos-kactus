<title>KACTUS — Casos de éxito</title>

<style>
html,body{margin:0;background:#0b0f0d}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.hx{--hx-page:#0b0f0d;--hx-text:#ecebe7;--hx-muted:#8a8986;--hx-label:#8a8a86;--hx-label-lit:#f4f2ee;--hx-empty:#2a2a2a;--hx-accent:#29c06b;
--hx-sans:'Urbanist',sans-serif;--hx-pad:32px;--hx-gap:10px;--hx-cols:10;--hx-rows:2;--hx-r:1.05;--hx-solid:55%;
box-sizing:border-box;display:flex;flex-direction:column;height:100vh;height:100svh;min-height:640px;overflow:hidden;
background:var(--hx-page);color:var(--hx-text);font-family:var(--hx-sans);font-weight:400;cursor:crosshair}
.hx *,.hx *::before,.hx *::after{box-sizing:border-box}
.hx a{color:inherit;text-decoration:none;cursor:inherit}
.hx-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:24px var(--hx-pad);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.hx-mark{font-size:28px;line-height:1;letter-spacing:.12em}
.hx-arch{opacity:.6}
.hx-nav{display:flex;gap:22px}
.hx-nav a{transition:color .2s}
@media (hover:hover){.hx-nav a:hover{color:var(--hx-accent)}}
.hx-grid{flex:1 1 0;min-height:0;margin:8px var(--hx-pad) 0;container-type:size;position:relative}
.hx-list{--hx-tw:calc((100cqw - (var(--hx-cols) - 1) * var(--hx-gap)) / var(--hx-cols));display:grid;grid-template-columns:repeat(var(--hx-cols),minmax(0,1fr));grid-template-rows:repeat(var(--hx-rows),minmax(0,1fr));gap:var(--hx-gap);height:100%;margin:0;padding:0;list-style:none;touch-action:pan-y pinch-zoom}
.hx-list li{min-width:0;min-height:0}
.hx-list button{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%;padding:10px;border:0;border-radius:3px;overflow:hidden;font:400 10px/1.2 var(--hx-sans);letter-spacing:.06em;color:var(--hx-label);text-align:left;cursor:inherit;
background:var(--hx-empty) repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px)}
.hx-list button:focus-visible{outline:1px solid var(--hx-accent);outline-offset:-1px}
.hx-list img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.55) contrast(1.05)}
.hx-num,.hx-name{position:relative;z-index:2}
.hx-list:not(.hx-glow) .hx-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hx-glow{position:absolute;inset:0;pointer-events:none;
-webkit-mask-image:radial-gradient(circle calc(var(--hx-tw) * var(--hx-r)) at var(--hx-x,-999px) var(--hx-y,-999px),#000 var(--hx-solid),transparent 100%);
mask-image:radial-gradient(circle calc(var(--hx-tw) * var(--hx-r)) at var(--hx-x,-999px) var(--hx-y,-999px),#000 var(--hx-solid),transparent 100%)}
.hx-glow button{color:var(--hx-label-lit);background:var(--hx-empty) repeating-linear-gradient(135deg,rgba(0,0,0,.1) 0 1px,transparent 1px 9px)}
.hx-glow img{filter:none}
.hx-glow button::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 30%,transparent 60%,rgba(0,0,0,.55))}
.hx-glow .hx-name{font-size:clamp(11px,calc(var(--hx-tw) * .09),20px);line-height:1.1;letter-spacing:.02em;overflow-wrap:anywhere}
.hx-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:28px var(--hx-pad) 32px}
.hx-hl{container-type:inline-size;min-width:0}
.hx-title{margin:0;font-weight:200;line-height:.95;letter-spacing:-.02em;white-space:nowrap;font-size:min(clamp(52px,8vw,130px),calc(100cqw / var(--hx-fit,12)))}
.hx-first{color:var(--hx-muted)}
.hx-side{display:flex;flex-direction:column;align-items:flex-end;gap:18px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.hx-say{margin:0;opacity:.6;white-space:nowrap}
.hx-pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 22px;border:1px solid rgba(236,235,231,.28);border-radius:999px;color:rgba(236,235,231,.75);white-space:nowrap;transition:border-color .6s ease,color .6s ease,box-shadow .6s ease}
.hx-pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4}
@media (hover:hover){.hx-pill:hover{border-color:var(--hx-accent);color:#fff;box-shadow:0 0 0 1px rgba(41,192,107,.25)}}
.hx-pill:active{border-color:var(--hx-accent);color:#fff}
@media (max-width:1023px){.hx{--hx-cols:5;--hx-rows:4;--hx-pad:24px}}
@media (max-width:599px){
.hx{--hx-cols:4;--hx-rows:5;--hx-pad:16px;--hx-gap:8px}
.hx-list button{padding:8px}
.hx-head{padding:18px 16px 14px;gap:10px 20px}
.hx-mark{font-size:24px}
.hx-arch{order:3;width:100%}
.hx-row{grid-template-columns:minmax(0,1fr);gap:16px;padding:20px 16px 32px}
.hx-title{font-size:min(52px,calc(100cqw / var(--hx-fit,12)))}
.hx-side{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.hx-say{white-space:normal}}
@media (prefers-reduced-motion:reduce){.hx *{transition:none!important}}
</style></head>
